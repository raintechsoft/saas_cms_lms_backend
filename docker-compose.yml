services:
  postgres:
    image: postgres:16-alpine
    container_name: saas-cms-lms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: saas_cms_lms
    ports:
      - "5432:5432"
    volumes:
      - saas_cms_lms_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saas_cms_lms"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  saas_cms_lms_postgres:
